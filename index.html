<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
     <header>
    <nav>
        <ul>
            <li>SPBR Developers</li>
        </ul>
    </nav>
    </header> 
    <main>
        <div class="password-generator">
    <div class="container">
        <h1>Password Generator</h1>
        <!-- password container -->
        <div class="password-container">
            <input type="text" readonly id="password">
            <i class="far fa-copy" id="copy-btn" title="copy to clipboard"></i>
        </div>
        <!-- options -->
         <div class="option">
            <label for="length">Password Length</label>
            <div class="range-container">
                <input type="range" id="length" name="password" min="8" max="20" value="12">
                <span id="length-value">12</span>
            </div>
         </div>
         <!-- include uppercase -->
          <div class="option">
            <label for="uppercase">Include Uppercase</label>
            <input type="checkbox" id="uppercase" checked>
          </div>
          <!-- include lowercase -->
          <div class="option">
            <label for="lowercase">Include Lowercase</label>
            <input type="checkbox" id="lowercase" checked>
          </div>
          <!-- include numbers -->
          <div class="option">
            <label for="numbers">Include Numbers</label>
            <input type="checkbox" id="numbers" checked>
          </div>
          <!-- include symbol -->
          <div class="option">
            <label for="symbol">Include Symbol</label>
            <input type="checkbox" id="symbols" checked>
          </div>
          <button id="generate-btn"><i class="fas fa-key"></i>Generate Password</button>
          <div class="strength-container ">
            <p>Password Strength:  <span id="strength-label"></span></p>
            <div class="strength-meter">
                <div class="strength-bar"></div>
            </div>
          </div>
    </div>
        </div>
</main>
    
    <script src="script.js"></script>
</body>
</html>
